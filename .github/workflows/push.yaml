name: Fixer push

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the patch artifact uploaded by the `nicebots-xyz/fixer` action.
        type: string
        default: fixer-patch
      commit-message:
        description: Message of the fix commit.
        type: string
        default: "style: Apply automated fixes"
      environment:
        description: Environment holding the app secrets. Created on first use if it does not exist.
        type: string
        default: fixer
    secrets:
      # The caller must pass both, even when they only exist in `environment`: a secret the caller doesn't pass
      # resolves to an empty string. A secret of `environment` takes precedence over the value passed.
      FIXER_APP_CLIENT_ID:
        description: Client ID of the fixer GitHub App.
        required: true
      FIXER_APP_PRIVATE_KEY:
        description: Private key of the fixer GitHub App.
        required: true

permissions:
  contents: read

jobs:
  push:
    name: Push fixes
    # The app token can only push to branches of this repository, never to forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    steps:
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/fixer

      - name: Validate patch
        shell: bash
        run: |
          patch="$RUNNER_TEMP/fixer/fixer.patch"
          # The patch comes from a job that ran pull request code: refuse anything touching CI config.
          if git apply --numstat "$patch" | cut -f3- | grep -E '(^|[/{ ])\.github/'; then
            echo "::error::The fixes change files under .github/, refusing to push them."
            exit 1
          fi

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FIXER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIXER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit and push
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          bot="${APP_SLUG}[bot]"
          email="$(gh api "/users/${bot}" --jq .id)+${bot}@users.noreply.github.com"

          # Fixes that are not idempotent would otherwise loop forever.
          if [ "$(git log -1 --format=%ae)" = "$email" ]; then
            echo "::error::The last commit is already a fixer commit, but the fixes changed files again."
            exit 1
          fi

          git apply --index "$RUNNER_TEMP/fixer/fixer.patch"
          git -c user.name="$bot" -c user.email="$email" commit --quiet --message "$COMMIT_MESSAGE"

          if ! git push origin "HEAD:refs/heads/${HEAD_REF}"; then
            if [ "$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)" != "$HEAD_SHA" ]; then
              echo "::notice::The branch moved since the fixes ran. Its new run will fix it."
              exit 0
            fi
            exit 1
          fi
